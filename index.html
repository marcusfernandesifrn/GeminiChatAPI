<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gemini Live Chat - Canva Embed</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            geminiBg: '#0f1015',
            geminiCard: '#181920',
            geminiBorder: '#2a2b36',
            geminiBlue: '#3b82f6',
            geminiPurple: '#8b5cf6',
          }
        }
      }
    }
  </script>
  <style>
    /* Scrollbar personalizada minimalista */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f1015;
    }
    ::-webkit-scrollbar-thumb {
      background: #2a2b36;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #3b82f6;
    }
  </style>
</head>
<body class="bg-geminiBg text-gray-100 min-h-screen flex flex-col font-sans antialiased">

  <!-- Header & Configuração de API Key -->
  <header class="border-b border-geminiBorder bg-geminiCard p-4 flex flex-col sm:flex-row items-center justify-between gap-3 shadow-md">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-geminiBlue to-geminiPurple flex items-center justify-center font-bold text-white text-sm shadow-lg">
        ✨
      </div>
      <div>
        <h1 class="font-bold text-base tracking-wide leading-none text-white">Gemini Live Demo</h1>
        <p class="text-xs text-gray-400 mt-1">Modelo: <span class="text-geminiBlue font-mono">gemini-3.8-flash</span></p>
      </div>
    </div>

    <!-- Input da API Key -->
    <div class="w-full sm:w-auto flex items-center gap-2">
      <div class="relative w-full sm:w-64">
        <input 
          type="password" 
          id="apiKey" 
          placeholder="Cole sua API Key aqui..." 
          class="w-full bg-geminiBg border border-geminiBorder rounded-lg px-3 py-1.5 text-xs text-gray-200 focus:outline-none focus:border-geminiBlue transition-colors pr-8"
        />
        <button 
          onclick="toggleKeyVisibility()" 
          title="Alternar visibilidade"
          class="absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white text-xs">
          👁️
        </button>
      </div>
      <button 
        onclick="saveApiKey()" 
        class="bg-geminiBlue hover:bg-blue-600 text-white text-xs px-3 py-1.5 rounded-lg font-medium transition-colors whitespace-nowrap shadow-sm">
        Salvar
      </button>
    </div>
  </header>

  <!-- Banner de Aviso de Status -->
  <div id="statusBanner" class="hidden bg-red-900/40 border-b border-red-500/50 px-4 py-2 text-xs text-red-200 text-center"></div>

  <!-- Chat Area -->
  <main id="chatContainer" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-4xl mx-auto w-full">
    <!-- Mensagem de Boas-Vindas -->
    <div class="flex gap-3 bg-geminiCard/60 border border-geminiBorder/60 p-4 rounded-xl text-sm">
      <div class="text-xl">💡</div>
      <div class="space-y-1">
        <p class="font-semibold text-gray-200">Demonstração Interativa Pronta</p>
        <p class="text-xs text-gray-400 leading-relaxed">
          Cole sua chave do Google AI Studio no topo. Digite uma pergunta abaixo para demonstrar o modelo em tempo real diretamente dentro do slide.
        </p>
      </div>
    </div>
  </main>

  <!-- Input Footer -->
  <footer class="border-t border-geminiBorder bg-geminiCard p-3">
    <div class="max-w-4xl mx-auto flex items-center gap-2">
      <textarea 
        id="userInput" 
        rows="1" 
        placeholder="Escreva uma pergunta para o Gemini..." 
        onkeydown="handleKeyPress(event)"
        class="flex-1 bg-geminiBg border border-geminiBorder rounded-xl px-4 py-2.5 text-sm text-gray-100 focus:outline-none focus:border-geminiBlue transition-colors resize-none overflow-hidden max-h-32"
      ></textarea>
      <button 
        onclick="sendMessage()" 
        id="sendBtn"
        class="bg-gradient-to-r from-geminiBlue to-geminiPurple hover:opacity-90 text-white p-2.5 rounded-xl font-medium transition-all shadow-md flex items-center justify-center">
        <svg class="w-5 h-5 transform rotate-90" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
        </svg>
      </button>
    </div>
  </footer>

  <script>
    // Carregar API Key salva localmente
    document.addEventListener('DOMContentLoaded', () => {
      const savedKey = localStorage.getItem('gemini_api_key');
      if (savedKey) {
        document.getElementById('apiKey').value = savedKey;
        showStatus('Chave de API salva carregada.', 'success');
      }
    });

    function toggleKeyVisibility() {
      const input = document.getElementById('apiKey');
      input.type = input.type === 'password' ? 'text' : 'password';
    }

    function saveApiKey() {
      const key = document.getElementById('apiKey').value.trim();
      if (key) {
        localStorage.setItem('gemini_api_key', key);
        showStatus('Chave de API salva com sucesso!', 'success');
      } else {
        localStorage.removeItem('gemini_api_key');
        showStatus('Chave removida.', 'info');
      }
    }

    function showStatus(msg, type) {
      const banner = document.getElementById('statusBanner');
      banner.innerText = msg;
      banner.classList.remove('hidden', 'bg-red-900/40', 'border-red-500/50', 'text-red-200', 'bg-emerald-900/40', 'border-emerald-500/50', 'text-emerald-200');
      
      if (type === 'error') {
        banner.classList.add('bg-red-900/40', 'border-red-500/50', 'text-red-200');
      } else {
        banner.classList.add('bg-emerald-900/40', 'border-emerald-500/50', 'text-emerald-200');
      }

      setTimeout(() => {
        banner.classList.add('hidden');
      }, 4000);
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    // Formatação leve de Markdown para HTML
    function parseMarkdown(text) {
      let html = text
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') // Escape HTML
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')                   // Bold
        .replace(/\*(.*?)\*/g, '<em>$1</em>')                               // Italic
        .replace(/`([^`]+)`/g, '<code class="bg-gray-800 text-geminiBlue px-1.5 py-0.5 rounded text-xs font-mono">$1</code>') // Code
        .replace(/\n/g, '<br>');                                           // Quebras de linha
      return html;
    }

    function appendMessage(sender, text) {
      const container = document.getElementById('chatContainer');
      const wrapper = document.createElement('div');
      wrapper.className = `flex gap-3 ${sender === 'user' ? 'justify-end' : 'justify-start'}`;

      const isUser = sender === 'user';
      const isSystem = sender === 'system';

      let bgClass = isUser 
        ? 'bg-geminiBlue text-white rounded-2xl rounded-tr-none' 
        : (isSystem ? 'bg-red-900/30 border border-red-500/40 text-red-200 rounded-xl' : 'bg-geminiCard border border-geminiBorder text-gray-200 rounded-2xl rounded-tl-none');

      wrapper.innerHTML = `
        ${!isUser ? `<div class="w-7 h-7 rounded-full bg-gradient-to-tr from-geminiBlue to-geminiPurple flex items-center justify-center text-xs text-white font-bold shrink-0 mt-1 shadow">✨</div>` : ''}
        <div class="max-w-[85%] px-4 py-2.5 text-sm ${bgClass} leading-relaxed shadow-sm">
          ${isUser ? text.replace(/\n/g, '<br>') : parseMarkdown(text)}
        </div>
      `;

      container.appendChild(wrapper);
      container.scrollTop = container.scrollHeight;
    }

    function appendLoading() {
      const container = document.getElementById('chatContainer');
      const wrapper = document.createElement('div');
      const id = 'loading-' + Date.now();
      wrapper.id = id;
      wrapper.className = 'flex gap-3 justify-start';

      wrapper.innerHTML = `
        <div class="w-7 h-7 rounded-full bg-gradient-to-tr from-geminiBlue to-geminiPurple flex items-center justify-center text-xs text-white font-bold shrink-0 animate-pulse">✨</div>
        <div class="bg-geminiCard border border-geminiBorder px-4 py-3 rounded-2xl rounded-tl-none text-sm text-gray-400 flex items-center gap-2">
          <div class="w-2 h-2 rounded-full bg-geminiBlue animate-bounce"></div>
          <div class="w-2 h-2 rounded-full bg-geminiPurple animate-bounce [animation-delay:0.2s]"></div>
          <div class="w-2 h-2 rounded-full bg-blue-400 animate-bounce [animation-delay:0.4s]"></div>
        </div>
      `;

      container.appendChild(wrapper);
      container.scrollTop = container.scrollHeight;
      return id;
    }

    function removeLoading(id) {
      const el = document.getElementById(id);
      if (el) el.remove();
    }

    async function sendMessage() {
      const apiKey = document.getElementById('apiKey').value.trim();
      const input = document.getElementById('userInput');
      const message = input.value.trim();

      if (!apiKey) {
        showStatus('Por favor, insira sua API Key no campo superior.', 'error');
        return;
      }
      if (!message) return;

      appendMessage('user', message);
      input.value = '';

      const loadingId = appendLoading();

      try {
        // ENDPOINT ATUALIZADO: usa gemini-3.8-flash
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            contents: [{
              parts: [{ text: message }]
            }]
          })
        });

        const data = await response.json();
        removeLoading(loadingId);

        if (data.error) {
          appendMessage('system', `Erro da API (${data.error.code}): ${data.error.message}`);
        } else if (data.candidates && data.candidates[0].content.parts[0].text) {
          const reply = data.candidates[0].content.parts[0].text;
          appendMessage('bot', reply);
        } else {
          appendMessage('system', 'Não foi possível obter uma resposta válida do modelo.');
        }
      } catch (err) {
        removeLoading(loadingId);
        appendMessage('system', `Erro de conexão: ${err.message}`);
      }
    }
  </script>
</body>
</html>
