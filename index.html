<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini AI Embed Demo</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        gemini: {
                            bg: '#090a0f',
                            card: '#13151f',
                            border: '#232738',
                            hover: '#2d3248',
                            purple: '#8b5cf6',
                            blue: '#3b82f6',
                            gradientStart: '#9333ea',
                            gradientEnd: '#2563eb'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #090a0f;
        }
        ::-webkit-scrollbar-thumb {
            background: #232738;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #373d57;
        }
        /* Style formatted output in response bubbles */
        .markdown-body strong { font-weight: 700; color: #f3f4f6; }
        .markdown-body em { font-style: italic; color: #e5e7eb; }
        .markdown-body code { background-color: #1e2235; padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 0.85em; color: #a7f3d0; }
        .markdown-body pre { background-color: #11131f; padding: 10px; border-radius: 8px; overflow-x: auto; margin: 8px 0; border: 1px solid #232738; }
        .markdown-body pre code { background: none; padding: 0; color: #cbd5e1; }
        .markdown-body ul { list-style-type: disc; margin-left: 1.25rem; margin-top: 4px; margin-bottom: 4px; }
        .markdown-body ol { list-style-type: decimal; margin-left: 1.25rem; margin-top: 4px; margin-bottom: 4px; }
        .markdown-body p { margin-bottom: 6px; }
        .markdown-body p:last-child { margin-bottom: 0; }
    </style>
</head>
<body class="bg-gemini-bg text-gray-100 font-sans h-full flex flex-col justify-between overflow-hidden antialiased selection:bg-purple-500 selection:text-white">

    <!-- Header Section -->
    <header class="bg-gemini-card/90 backdrop-blur border-b border-gemini-border px-4 py-3 flex items-center justify-between z-10 shrink-0 shadow-md">
        <div class="flex items-center space-x-2.5">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-gemini-gradientStart to-gemini-gradientEnd flex items-center justify-center shadow-lg shadow-purple-500/20">
                <span class="text-white font-bold text-sm">✦</span>
            </div>
            <div>
                <h1 class="font-bold text-xs sm:text-sm tracking-wide bg-gradient-to-r from-purple-400 via-pink-400 to-blue-400 bg-clip-text text-transparent">Gemini AI Demo</h1>
                <p class="text-[10px] text-gray-400 flex items-center gap-1">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span> Modelo: <code class="text-gray-300">gemini-2.5-flash</code>
                </p>
            </div>
        </div>

        <!-- Controls / Actions -->
        <div class="flex items-center space-x-2">
            <!-- Key Modal Toggle Button -->
            <button id="toggleKeyBtn" title="Configurar API Key" class="text-xs px-3 py-1.5 rounded-lg bg-gemini-border hover:bg-gemini-hover text-gray-200 flex items-center gap-1.5 transition font-medium border border-transparent">
                <i class="fa-solid fa-key text-amber-400 text-xs"></i>
                <span id="keyStatusText" class="text-[11px]">API Key</span>
            </button>
            
            <!-- Clear Chat Button -->
            <button id="clearBtn" title="Limpar conversa" class="text-xs px-2.5 py-1.5 rounded-lg bg-gemini-border hover:bg-red-950/60 hover:text-red-300 hover:border-red-800/50 text-gray-300 flex items-center gap-1.5 transition border border-transparent">
                <i class="fa-solid fa-trash-can text-xs"></i>
            </button>
        </div>
    </header>

    <!-- API Key Input Bar (Collapsible Drawer) -->
    <div id="keySection" class="bg-gemini-card border-b border-gemini-border px-4 py-3 transition-all duration-300 hidden">
        <div class="max-w-2xl mx-auto flex flex-col gap-2">
            <div class="flex items-center justify-between">
                <label for="apiKeyInput" class="text-xs font-semibold text-gray-200 flex items-center gap-1.5">
                    <i class="fa-solid fa-lock text-purple-400"></i> Sua API Key do Google AI Studio
                </label>
                <a href="https://aistudio.google.com/app/apikey" target="_blank" class="text-[11px] text-purple-400 hover:text-purple-300 hover:underline flex items-center gap-1">
                    Obter Chave Grátis <i class="fa-solid fa-arrow-up-right-from-square text-[9px]"></i>
                </a>
            </div>
            <div class="flex gap-2">
                <div class="relative flex-1">
                    <input type="password" id="apiKeyInput" placeholder="Cole sua chave (AIzaSy...)" class="w-full bg-gemini-bg border border-gemini-border rounded-lg px-3 py-1.5 pr-8 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-purple-500 transition">
                    <button id="toggleVisibilityBtn" class="absolute right-2.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white text-xs">
                        <i class="fa-solid fa-eye" id="eyeIcon"></i>
                    </button>
                </div>
                <button id="saveKeyBtn" class="bg-purple-600 hover:bg-purple-700 text-white text-xs px-4 py-1.5 rounded-lg font-medium transition shadow-md">
                    Salvar
                </button>
            </div>
            <p class="text-[10px] text-gray-400 flex items-center gap-1">
                <i class="fa-solid fa-shield-halved text-gray-500"></i> A chave fica gravada com segurança no seu próprio navegador.
            </p>
        </div>
    </div>

    <!-- Messages Container -->
    <main id="chatContainer" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-4xl w-full mx-auto">
        <!-- Welcome Screen -->
        <div id="welcomeMessage" class="h-full flex flex-col items-center justify-center text-center p-6 space-y-4 my-auto">
            <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-purple-600 via-indigo-600 to-blue-600 flex items-center justify-center text-3xl shadow-xl shadow-purple-500/20 animate-pulse">
                ✦
            </div>
            <div>
                <h2 class="text-xl font-bold text-white">Demonstração ao Vivo do Gemini</h2>
                <p class="text-xs text-gray-400 max-w-xs mt-1">
                    Faça perguntas em tempo real diretamente de dentro do seu slide no Canva.
                </p>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 w-full max-w-md pt-2 text-left">
                <button onclick="sendQuickPrompt('Resuma em 3 pontos rápidos por que a IA gerativa transforma apresentações.')" class="p-3 bg-gemini-card hover:bg-gemini-hover border border-gemini-border rounded-xl text-xs text-gray-300 transition text-left group">
                    <div class="font-medium text-purple-400 group-hover:text-purple-300 mb-0.5">💡 Pergunta Rápida</div>
                    <div class="text-[11px] text-gray-400 line-clamp-2">"Resuma em 3 pontos o impacto da IA em apresentações..."</div>
                </button>
                <button onclick="sendQuickPrompt('Crie uma frase curta e impactante sobre o futuro da inteligência artificial.')" class="p-3 bg-gemini-card hover:bg-gemini-hover border border-gemini-border rounded-xl text-xs text-gray-300 transition text-left group">
                    <div class="font-medium text-blue-400 group-hover:text-blue-300 mb-0.5">🚀 Slogan de IA</div>
                    <div class="text-[11px] text-gray-400 line-clamp-2">"Crie uma frase impactante sobre o futuro da IA..."</div>
                </button>
            </div>
        </div>
    </main>

    <!-- Error Alert Toast -->
    <div id="errorToast" class="fixed top-14 left-1/2 -translate-x-1/2 bg-red-950/90 border border-red-500/80 text-red-200 text-xs px-4 py-3 rounded-xl shadow-2xl backdrop-blur flex items-center gap-2.5 hidden transition-all duration-300 z-50 max-w-md w-[90%]">
        <i class="fa-solid fa-circle-exclamation text-red-400 text-sm shrink-0"></i>
        <div class="flex-1 text-[11px]" id="errorMessage">Ocorreu um erro ao processar.</div>
        <button onclick="hideError()" class="text-red-300 hover:text-white p-1"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <!-- Input Footer -->
    <footer class="bg-gemini-card/80 backdrop-blur border-t border-gemini-border p-3 shrink-0">
        <form id="chatForm" class="max-w-4xl mx-auto flex items-center gap-2">
            <div class="relative flex-1">
                <textarea id="promptInput" rows="1" placeholder="Escreva uma pergunta para o Gemini..." class="w-full bg-gemini-bg border border-gemini-border rounded-xl px-4 py-2.5 pr-10 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-purple-500 resize-none transition max-h-28"></textarea>
            </div>
            <button type="submit" id="sendBtn" class="bg-gradient-to-r from-gemini-gradientStart to-gemini-gradientEnd hover:opacity-95 text-white w-9 h-9 rounded-xl flex items-center justify-center shadow-lg transition shrink-0 disabled:opacity-40 disabled:cursor-not-allowed">
                <i class="fa-solid fa-paper-plane text-xs"></i>
            </button>
        </form>
    </footer>

    <!-- JavaScript Application Logic -->
    <script>
        // DOM Elements
        const chatContainer = document.getElementById('chatContainer');
        const welcomeMessage = document.getElementById('welcomeMessage');
        const chatForm = document.getElementById('chatForm');
        const promptInput = document.getElementById('promptInput');
        const sendBtn = document.getElementById('sendBtn');
        const clearBtn = document.getElementById('clearBtn');
        const toggleKeyBtn = document.getElementById('toggleKeyBtn');
        const keySection = document.getElementById('keySection');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const saveKeyBtn = document.getElementById('saveKeyBtn');
        const toggleVisibilityBtn = document.getElementById('toggleVisibilityBtn');
        const eyeIcon = document.getElementById('eyeIcon');
        const errorToast = document.getElementById('errorToast');
        const errorMessage = document.getElementById('errorMessage');

        // State Management
        let userApiKey = localStorage.getItem('gemini_api_key') || '';

        // Initialize Key State
        if (userApiKey) {
            apiKeyInput.value = userApiKey;
            updateKeyStatus(true);
        } else {
            keySection.classList.remove('hidden');
        }

        // Toggle Key Drawer
        toggleKeyBtn.addEventListener('click', () => {
            keySection.classList.toggle('hidden');
        });

        // Toggle Password Visibility
        toggleVisibilityBtn.addEventListener('click', () => {
            const isPassword = apiKeyInput.type === 'password';
            apiKeyInput.type = isPassword ? 'text' : 'password';
            eyeIcon.className = isPassword ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
        });

        // Save Key
        saveKeyBtn.addEventListener('click', () => {
            const key = apiKeyInput.value.trim();
            if (key) {
                userApiKey = key;
                localStorage.setItem('gemini_api_key', key);
                updateKeyStatus(true);
                keySection.classList.add('hidden');
                showNotification('API Key salva no seu navegador com sucesso!', false);
            } else {
                userApiKey = '';
                localStorage.removeItem('gemini_api_key');
                updateKeyStatus(false);
                showNotification('API Key removida.', true);
            }
        });

        function updateKeyStatus(hasKey) {
            if (hasKey) {
                toggleKeyBtn.classList.remove('bg-gemini-border');
                toggleKeyBtn.classList.add('bg-emerald-950/60', 'border-emerald-600/50', 'text-emerald-300');
            } else {
                toggleKeyBtn.classList.add('bg-gemini-border');
                toggleKeyBtn.classList.remove('bg-emerald-950/60', 'border-emerald-600/50', 'text-emerald-300');
            }
        }

        // Auto-expand textarea
        promptInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 112) + 'px';
        });

        // Enter key to submit (Shift+Enter for newline)
        promptInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                chatForm.dispatchEvent(new Event('submit'));
            }
        });

        // Simple Markdown Parsing for Response Formatting
        function parseMarkdown(text) {
            if (!text) return '';
            let html = text
                // Escapar caracteres perigosos
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                // Bloco de Código (```code```)
                .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
                // Código inline (`code`)
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                // Negrito (**texto**)
                .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
                // Itálico (*texto*)
                .replace(/\*([^*]+)\*/g, '<em>$1</em>')
                // Quebras de linha para parágrafos
                .replace(/\n\n/g, '</p><p>')
                .replace(/\n/g, '<br>');

            return `<div class="markdown-body"><p>${html}</p></div>`;
        }

        // Handle Form Submit
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = promptInput.value.trim();
            if (!text) return;

            if (!userApiKey) {
                showNotification('Insira e salve sua API Key do Gemini antes de enviar.');
                keySection.classList.remove('hidden');
                return;
            }

            hideError();
            if (welcomeMessage) welcomeMessage.style.display = 'none';

            // Render User Message
            appendMessage('user', text);
            promptInput.value = '';
            promptInput.style.height = 'auto';

            // Loading Indicator
            const loadingId = appendLoadingBubble();
            sendBtn.disabled = true;

            try {
                const response = await fetchGeminiAPI(text);
                removeBubble(loadingId);
                appendMessage('model', response);
            } catch (err) {
                removeBubble(loadingId);
                showNotification(err.message || 'Erro de comunicação com o Gemini.');
                appendMessage('system', `Erro: ${err.message}`);
            } finally {
                sendBtn.disabled = false;
                scrollToBottom();
            }
        });

        // Quick prompts helper
        window.sendQuickPrompt = function(promptText) {
            promptInput.value = promptText;
            chatForm.dispatchEvent(new Event('submit'));
        };

        // Clear Chat History
        clearBtn.addEventListener('click', () => {
            chatContainer.innerHTML = '';
            chatContainer.appendChild(welcomeMessage);
            welcomeMessage.style.display = 'flex';
            hideError();
        });

        // Append User, Model or System Message
        function appendMessage(role, content) {
            const isUser = role === 'user';
            const isSystem = role === 'system';
            const wrapper = document.createElement('div');
            wrapper.className = `flex ${isUser ? 'justify-end' : 'justify-start'} animate-fade-in`;

            const bubble = document.createElement('div');
            
            if (isSystem) {
                bubble.className = 'max-w-[90%] rounded-xl px-3.5 py-2 text-xs bg-red-950/40 border border-red-800/50 text-red-300 shadow-sm mx-auto my-1';
                bubble.textContent = content;
            } else {
                bubble.className = `max-w-[85%] sm:max-w-[75%] rounded-2xl px-4 py-3 text-xs leading-relaxed ${
                    isUser 
                    ? 'bg-gradient-to-r from-gemini-gradientStart to-gemini-gradientEnd text-white rounded-br-none shadow-md font-normal' 
                    : 'bg-gemini-card border border-gemini-border text-gray-200 rounded-bl-none shadow-sm'
                }`;

                if (!isUser) {
                    const header = document.createElement('div');
                    header.className = 'flex items-center gap-1.5 mb-1.5 text-[10px] font-semibold text-purple-400';
                    header.innerHTML = `<span>✦ Gemini 2.5 Flash</span>`;
                    bubble.appendChild(header);

                    const contentNode = document.createElement('div');
                    contentNode.innerHTML = parseMarkdown(content);
                    bubble.appendChild(contentNode);
                } else {
                    const textNode = document.createElement('div');
                    textNode.className = 'whitespace-pre-wrap break-words';
                    textNode.textContent = content;
                    bubble.appendChild(textNode);
                }
            }

            wrapper.appendChild(bubble);
            chatContainer.appendChild(wrapper);
            scrollToBottom();
        }

        // Animated Loading Bubble
        function appendLoadingBubble() {
            const id = 'loading-' + Date.now();
            const wrapper = document.createElement('div');
            wrapper.id = id;
            wrapper.className = 'flex justify-start';

            wrapper.innerHTML = `
                <div class="bg-gemini-card border border-gemini-border rounded-2xl rounded-bl-none px-4 py-3 text-xs flex items-center space-x-2.5">
                    <span class="text-[11px] text-purple-400 font-medium">✦ Processando resposta...</span>
                    <div class="flex space-x-1">
                        <div class="w-1.5 h-1.5 bg-purple-500 rounded-full animate-bounce" style="animation-delay: 0s"></div>
                        <div class="w-1.5 h-1.5 bg-indigo-400 rounded-full animate-bounce" style="animation-delay: 0.15s"></div>
                        <div class="w-1.5 h-1.5 bg-blue-400 rounded-full animate-bounce" style="animation-delay: 0.3s"></div>
                    </div>
                </div>
            `;
            chatContainer.appendChild(wrapper);
            scrollToBottom();
            return id;
        }

        function removeBubble(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Notification Banner (Errors or Success)
        function showNotification(msg, isError = true) {
            errorMessage.textContent = msg;
            errorToast.classList.remove('hidden');
            if (!isError) {
                errorToast.classList.remove('bg-red-950/90', 'border-red-500/80', 'text-red-200');
                errorToast.classList.add('bg-emerald-950/90', 'border-emerald-500/80', 'text-emerald-200');
            } else {
                errorToast.classList.add('bg-red-950/90', 'border-red-500/80', 'text-red-200');
                errorToast.classList.remove('bg-emerald-950/90', 'border-emerald-500/80', 'text-emerald-200');
            }
            setTimeout(hideError, 6000);
        }

        function hideError() {
            errorToast.classList.add('hidden');
        }

        // Main Fetch Function with Updated Gemini 2.5 Flash Endpoint
        async function fetchGeminiAPI(promptText) {
            // Corrected Endpoint: gemini-2.5-flash
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${userApiKey}`;
            
            const payload = {
                contents: [{
                    parts: [{ text: promptText }]
                }]
            };

            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await response.json();

            if (!response.ok || data.error) {
                const message = data.error?.message || `Erro ${response.status}: Falha de requisição.`;
                throw new Error(message);
            }

            const replyText = data.candidates?.[0]?.content?.parts?.[0]?.text;
            
            if (!replyText) {
                throw new Error('A API respondeu mas não retornou texto válido.');
            }

            return replyText;
        }
    </script>
</body>
</html>
